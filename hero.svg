<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#F1E9DA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#E4D9C5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#heroBg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="#C1603C"/>

  <!-- Identity block -->
  <g transform="translate(60,90)">
    <text x="0" y="0" font-size="13" letter-spacing="4" fill="#8C8577" font-family="'Courier New', monospace">PORTFOLIO / 2026</text>

    <text x="0" y="52" font-size="54" font-weight="700" fill="#232019">HIREN KANZARIYA</text>
    <rect x="2" y="66" width="0" height="4" fill="#C1603C">
      <animate attributeName="width" from="0" to="430" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
      <text x="0" y="105" font-size="20" font-weight="600" fill="#6E7452" letter-spacing="1">AI / ML &amp; DATA ANALYST</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
      <text x="0" y="145" font-size="15" fill="#4A453D">Turning raw data into practical, intelligent solutions.</text>
      <text x="0" y="168" font-size="15" fill="#4A453D">Python &#183; SQL &#183; Machine Learning &#183; Data Visualization</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.7s" fill="freeze"/>
      <rect x="0" y="200" width="150" height="34" rx="3" fill="none" stroke="#232019" stroke-width="1.2"/>
      <text x="75" y="222" font-size="12" letter-spacing="1.5" fill="#232019" text-anchor="middle" font-family="'Courier New', monospace">OPEN TO WORK</text>
      <circle cx="20" cy="217" r="4" fill="#6E7452">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="45" y="221" font-size="12" fill="#4A453D" font-family="'Courier New', monospace" opacity="0"><tspan/></text>
    </g>

    <g transform="translate(0,255)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2s" fill="freeze"/>
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#8C8577" font-family="'Courier New', monospace">BASED IN GUJARAT, INDIA</text>
    </g>
  </g>

  <!-- Right side: data flow story -->
  <g transform="translate(660,50)">
    <text x="0" y="0" font-size="11" letter-spacing="3" fill="#8C8577" font-family="'Courier New', monospace">THE PIPELINE</text>

    <!-- vertical flow -->
    <g font-family="'Courier New', monospace" font-size="12.5" fill="#232019">
      <!-- node 1 -->
      <g transform="translate(0,35)">
        <rect x="0" y="0" width="150" height="34" rx="2" fill="#232019"/>
        <text x="75" y="22" text-anchor="middle" fill="#FAF6EF" letter-spacing="1">INPUT DATA</text>
      </g>
      <line x1="75" y1="69" x2="75" y2="99" stroke="#8C8577" stroke-width="1.5" stroke-dasharray="30">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
      </line>

      <!-- node 2 -->
      <g transform="translate(0,99)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
        <rect x="0" y="0" width="150" height="34" rx="2" fill="none" stroke="#4A453D" stroke-width="1.2"/>
        <text x="75" y="22" text-anchor="middle" fill="#232019" letter-spacing="1">ANALYSIS</text>
      </g>
      <line x1="75" y1="133" x2="75" y2="163" stroke="#8C8577" stroke-width="1.5" stroke-dasharray="30">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.6s" begin="1.3s" fill="freeze"/>
      </line>

      <!-- node 3 -->
      <g transform="translate(0,163)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
        <rect x="0" y="0" width="150" height="34" rx="2" fill="none" stroke="#4A453D" stroke-width="1.2"/>
        <text x="75" y="22" text-anchor="middle" fill="#232019" letter-spacing="1">MACHINE LEARNING</text>
      </g>
      <line x1="75" y1="197" x2="75" y2="227" stroke="#8C8577" stroke-width="1.5" stroke-dasharray="30">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.6s" begin="2.1s" fill="freeze"/>
      </line>

      <!-- node 4 -->
      <g transform="translate(0,227)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
        <rect x="0" y="0" width="150" height="34" rx="2" fill="none" stroke="#4A453D" stroke-width="1.2"/>
        <text x="75" y="22" text-anchor="middle" fill="#232019" letter-spacing="1">INSIGHT</text>
      </g>
      <line x1="75" y1="261" x2="75" y2="291" stroke="#8C8577" stroke-width="1.5" stroke-dasharray="30">
        <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.6s" begin="2.9s" fill="freeze"/>
      </line>

      <!-- node 5 -->
      <g transform="translate(0,291)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.3s" fill="freeze"/>
        <rect x="0" y="0" width="150" height="34" rx="2" fill="#C1603C"/>
        <text x="75" y="22" text-anchor="middle" fill="#FAF6EF" letter-spacing="1">SOLUTION</text>
      </g>
    </g>

    <!-- traveling dot -->
    <circle r="3.5" fill="#C1603C">
      <animateMotion dur="4s" repeatCount="indefinite" path="M75,52 L75,116 L75,180 L75,244 L75,308"/>
    </circle>

    <!-- mini bar chart -->
    <g transform="translate(230,120)">
      <text x="0" y="-12" font-size="10" letter-spacing="1.5" fill="#8C8577" font-family="'Courier New', monospace">MODEL SCORE</text>
      <rect x="0" y="60" width="16" height="0" fill="#E4D9C5"><animate attributeName="height" to="60" dur="1s" begin="1s" fill="freeze"/><animate attributeName="y" to="0" dur="1s" begin="1s" fill="freeze"/></rect>
      <rect x="24" y="60" width="16" height="0" fill="#E4D9C5"><animate attributeName="height" to="42" dur="1s" begin="1.2s" fill="freeze"/><animate attributeName="y" to="18" dur="1s" begin="1.2s" fill="freeze"/></rect>
      <rect x="48" y="60" width="16" height="0" fill="#D6A94A"><animate attributeName="height" to="70" dur="1s" begin="1.4s" fill="freeze"/><animate attributeName="y" to="-10" dur="1s" begin="1.4s" fill="freeze"/></rect>
      <rect x="72" y="60" width="16" height="0" fill="#6E7452"><animate attributeName="height" to="85" dur="1s" begin="1.6s" fill="freeze"/><animate attributeName="y" to="-25" dur="1s" begin="1.6s" fill="freeze"/></rect>
      <line x1="0" y1="60" x2="88" y2="60" stroke="#8C8577" stroke-width="1"/>
    </g>

    <!-- code fragment -->
    <g transform="translate(230,230)" font-family="'Courier New', monospace" font-size="11" fill="#4A453D">
      <text x="0" y="0" opacity="0"><animate attributeName="opacity" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>SELECT insight</text>
      <text x="0" y="16" opacity="0"><animate attributeName="opacity" to="1" dur="0.3s" begin="2.5s" fill="freeze"/>FROM raw_data</text>
      <text x="0" y="32" opacity="0"><animate attributeName="opacity" to="1" dur="0.3s" begin="2.8s" fill="freeze"/>WHERE signal = true;</text>
      <rect x="140" y="21" width="7" height="12" fill="#232019" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- bottom hairline -->
  <line x1="60" y1="374" x2="1140" y2="374" stroke="#E4D9C5" stroke-width="1"/>
  <text x="60" y="392" font-size="10" letter-spacing="2" fill="#8C8577" font-family="'Courier New', monospace">SCROLL TO EXPLORE</text>
</svg>
