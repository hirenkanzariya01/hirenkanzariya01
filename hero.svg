<svg width="1200" height="350" viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#060a1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .node { fill: #22d3ee; filter: url(#softBlur); }
      .edge { stroke: #2c3a63; stroke-width: 1; }
      .mono { font-family: 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" fill="url(#glow)" cx="900" cy="80">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1000" cy="70" r="220" fill="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="280" r="180" fill="url(#glowViolet)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Faint grid -->
  <g stroke="#132042" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Neural network background (right side) -->
  <g opacity="0.85">
    <g class="edge">
      <line x1="820" y1="90" x2="900" y2="60"/>
      <line x1="820" y1="90" x2="900" y2="130"/>
      <line x1="820" y1="90" x2="900" y2="200"/>
      <line x1="850" y1="220" x2="900" y2="60"/>
      <line x1="850" y1="220" x2="900" y2="130"/>
      <line x1="850" y1="220" x2="900" y2="200"/>
      <line x1="900" y1="60" x2="990" y2="100"/>
      <line x1="900" y1="130" x2="990" y2="100"/>
      <line x1="900" y1="130" x2="990" y2="170"/>
      <line x1="900" y1="200" x2="990" y2="170"/>
      <line x1="990" y1="100" x2="1070" y2="140"/>
      <line x1="990" y1="170" x2="1070" y2="140"/>
    </g>

    <circle class="node" cx="820" cy="90" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="850" cy="220" r="5" fill="#818cf8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="900" cy="60" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="900" cy="130" r="6" fill="#34d399"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="900" cy="200" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="990" cy="100" r="6" fill="#818cf8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="990" cy="170" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle class="node" cx="1070" cy="140" r="7" fill="#34d399"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>

    <!-- traveling particles -->
    <circle r="3" fill="#e0f2fe">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M820,90 L900,130 L990,100 L1070,140"/>
    </circle>
    <circle r="3" fill="#e0f2fe">
      <animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M850,220 L900,200 L990,170 L1070,140"/>
    </circle>
    <circle r="2.5" fill="#c7d2fe">
      <animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite" path="M820,90 L900,60 L990,100"/>
    </circle>
  </g>

  <!-- Name -->
  <g class="sans">
    <text x="60" y="140" font-size="56" font-weight="700" fill="url(#titleGrad)" opacity="0">
      HIREN KANZARIYA
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;1" dur="1.6s" fill="freeze"/>
    </text>
    <text x="60" y="180" font-size="22" letter-spacing="4" fill="#93c5fd" opacity="0">
      AI / ML &amp; DATA ANALYST
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
    </text>
  </g>

  <!-- Terminal-style typing subtitle -->
  <g class="mono">
    <rect x="58" y="205" width="560" height="34" rx="6" fill="#0d1326" stroke="#1e2a4a"/>
    <clipPath id="typeClip">
      <rect x="70" y="205" width="0" height="34">
        <animate attributeName="width" values="0;540;540;540" keyTimes="0;0.55;0.9;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <text x="70" y="228" font-size="17" fill="#34d399" clip-path="url(#typeClip)">&gt;&gt;&gt; Building Intelligent Solutions</text>
    <rect x="595" y="210" width="9" height="20" fill="#34d399">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Small floating data bars (mini chart) -->
  <g transform="translate(60,255)">
    <rect x="0" y="30" width="10" height="0" fill="#22d3ee"><animate attributeName="height" values="0;25;25" keyTimes="0;0.6;1" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="30;5;5" keyTimes="0;0.6;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="16" y="30" width="10" height="0" fill="#818cf8"><animate attributeName="height" values="0;18;18" keyTimes="0;0.6;1" dur="2.4s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="30;12;12" keyTimes="0;0.6;1" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="32" y="30" width="10" height="0" fill="#34d399"><animate attributeName="height" values="0;30;30" keyTimes="0;0.6;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="30;0;0" keyTimes="0;0.6;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="48" y="30" width="10" height="0" fill="#22d3ee"><animate attributeName="height" values="0;12;12" keyTimes="0;0.6;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="30;18;18" keyTimes="0;0.6;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>
</svg>
