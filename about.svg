<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="460" fill="#FAF6EF"/>

  <text x="60" y="55" font-size="12" letter-spacing="3" fill="#8C8577" font-family="'Courier New', monospace">01 &#8212; ABOUT</text>
  <text x="60" y="90" font-size="30" font-weight="700" fill="#232019">Who I Am</text>
  <line x1="60" y1="106" x2="130" y2="106" stroke="#C1603C" stroke-width="3"/>

  <!-- Convergence diagram -->
  <g transform="translate(150,150)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#232019" letter-spacing="1">HIREN KANZARIYA</text>

    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      <rect x="0" y="40" width="130" height="46" rx="3" fill="none" stroke="#6E7452" stroke-width="1.3"/>
      <text x="65" y="59" text-anchor="middle" font-size="12.5" font-weight="600" fill="#232019">AI / ML</text>
      <text x="65" y="75" text-anchor="middle" font-size="9.5" fill="#8C8577" font-family="'Courier New', monospace">models &#183; pipelines</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      <rect x="170" y="40" width="160" height="46" rx="3" fill="none" stroke="#C1603C" stroke-width="1.3"/>
      <text x="250" y="59" text-anchor="middle" font-size="12.5" font-weight="600" fill="#232019">DATA ANALYSIS</text>
      <text x="250" y="75" text-anchor="middle" font-size="9.5" fill="#8C8577" font-family="'Courier New', monospace">SQL &#183; dashboards</text>
    </g>

    <!-- connectors -->
    <path d="M65,86 L65,110 Q65,120 90,120 L215,120 Q240,120 240,140" fill="none" stroke="#8C8577" stroke-width="1.3" stroke-dasharray="200" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="0.9s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="0.8s" begin="0.9s" fill="freeze"/>
    </path>
    <path d="M250,86 L250,110 Q250,120 240,120 L240,140" fill="none" stroke="#8C8577" stroke-width="1.3" stroke-dasharray="80" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="0.9s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="80" to="0" dur="0.6s" begin="0.9s" fill="freeze"/>
    </path>

    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
      <rect x="145" y="145" width="190" height="52" rx="3" fill="#232019"/>
      <text x="240" y="168" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FAF6EF" letter-spacing="0.5">PRACTICAL, REAL-WORLD</text>
      <text x="240" y="184" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FAF6EF" letter-spacing="0.5">SOLUTIONS</text>
    </g>

    <circle r="3" fill="#D6A94A" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.1s" begin="2.1s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="2.1s" repeatCount="indefinite" path="M65,86 L65,120 L240,120 L240,170"/>
    </circle>
  </g>

  <!-- philosophy list -->
  <g transform="translate(660,140)" font-family="'Helvetica Neue', Arial, sans-serif">
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
      <circle cx="4" cy="4" r="4" fill="#C1603C"/>
      <text x="20" y="9" font-size="14" fill="#232019">I enjoy the full pipeline &#8212; cleaning messy data,</text>
      <text x="20" y="28" font-size="14" fill="#232019">exploring it, training models, evaluating results.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
      <circle cx="4" cy="54" r="4" fill="#6E7452"/>
      <text x="20" y="59" font-size="14" fill="#232019">Practical machine learning and data analysis</text>
      <text x="20" y="78" font-size="14" fill="#232019">over hype &#8212; solving real problems first.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
      <circle cx="4" cy="104" r="4" fill="#D6A94A"/>
      <text x="20" y="109" font-size="14" fill="#232019">I build small, focused projects to keep learning</text>
      <text x="20" y="128" font-size="14" fill="#232019">by doing, not just reading.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
      <circle cx="4" cy="154" r="4" fill="#C1603C"/>
      <text x="20" y="159" font-size="14" fill="#232019">Comfortable moving between a Jupyter notebook,</text>
      <text x="20" y="178" font-size="14" fill="#232019">a SQL query, and a dashboard in the same afternoon.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="2.1s" fill="freeze"/>
      <circle cx="4" cy="204" r="4" fill="#6E7452"/>
      <text x="20" y="209" font-size="14" fill="#232019">Currently sharpening skills in AI Agents,</text>
      <text x="20" y="228" font-size="14" fill="#232019">Generative AI, and Data Engineering.</text>
    </g>
  </g>

  <line x1="60" y1="430" x2="1140" y2="430" stroke="#E4D9C5" stroke-width="1"/>
  <text x="60" y="450" font-size="10.5" letter-spacing="1.5" fill="#8C8577" font-family="'Courier New', monospace">GUJARAT, INDIA &#8212; OPEN TO REMOTE &amp; ON-SITE OPPORTUNITIES</text>
</svg>
