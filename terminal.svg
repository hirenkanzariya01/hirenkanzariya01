<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="1000" height="420" rx="8" fill="#232019"/>

  <!-- title bar -->
  <rect width="1000" height="34" rx="8" fill="#2E2A22"/>
  <rect y="26" width="1000" height="8" fill="#2E2A22"/>
  <circle cx="24" cy="17" r="6" fill="#C1603C"/>
  <circle cx="46" cy="17" r="6" fill="#D6A94A"/>
  <circle cx="68" cy="17" r="6" fill="#6E7452"/>
  <text x="500" y="22" text-anchor="middle" font-size="11.5" fill="#8C8577" letter-spacing="1">hiren@portfolio &#8212; zsh</text>

  <g transform="translate(28,64)" font-size="13.5">
    <!-- whoami -->
    <text x="0" y="0" fill="#D6A94A" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="0.3s" fill="freeze"/>$ whoami</text>
    <text x="0" y="24" fill="#F1E9DA" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="0.9s" fill="freeze"/>Hiren Kanzariya</text>

    <text x="0" y="56" fill="#D6A94A" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="1.4s" fill="freeze"/>$ role</text>
    <text x="0" y="80" fill="#F1E9DA" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="2.0s" fill="freeze"/>AI/ML &amp; Data Analyst &#8212; Gujarat, India</text>

    <text x="0" y="112" fill="#D6A94A" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="2.5s" fill="freeze"/>$ skills</text>
    <text x="0" y="136" fill="#F1E9DA" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="3.1s" fill="freeze"/>Python | SQL | Pandas | Scikit-learn | Power BI</text>

    <!-- SQL block -->
    <text x="0" y="168" fill="#D6A94A" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="3.6s" fill="freeze"/>$ psql -f profile_query.sql</text>

    <g opacity="0" transform="translate(0,192)">
      <animate attributeName="opacity" to="1" dur="0.2s" begin="4.1s" fill="freeze"/>
      <text x="0" y="0" fill="#8C8577">SELECT</text>
      <text x="20" y="20" fill="#F1E9DA">skills, experience, projects</text>
      <text x="0" y="40" fill="#8C8577">FROM</text>
      <text x="20" y="40" fill="#F1E9DA" x2="60">hiren_profile</text>
      <text x="0" y="60" fill="#8C8577">WHERE</text>
      <text x="20" y="60" fill="#F1E9DA">role = 'AI/ML &amp; Data Analyst';</text>
    </g>

    <!-- results table -->
    <g opacity="0" transform="translate(0,282)">
      <animate attributeName="opacity" to="1" dur="0.3s" begin="4.7s" fill="freeze"/>
      <text x="0" y="0" fill="#6E7452">skills</text>
      <text x="140" y="0" fill="#6E7452">experience</text>
      <text x="320" y="0" fill="#6E7452">projects</text>
      <line x1="0" y1="8" x2="600" y2="8" stroke="#4A453D"/>
      <text x="0" y="26" fill="#F1E9DA">Python/SQL/ML</text>
      <text x="140" y="26" fill="#F1E9DA">Applied &amp; growing</text>
      <text x="320" y="26" fill="#F1E9DA">4 shipped</text>
    </g>

    <text x="0" y="345" fill="#D6A94A" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="5.4s" fill="freeze"/>$ status</text>
    <text x="0" y="369" fill="#C1603C" font-weight="bold" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="5.9s" fill="freeze"/>OPEN TO OPPORTUNITIES</text>

    <rect x="0" y="358" width="9" height="16" fill="#F1E9DA" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="5.9s" repeatCount="indefinite"/>
      <animate attributeName="x" from="0" to="205" dur="0.1s" begin="5.9s" fill="freeze"/>
    </rect>
  </g>
</svg>
