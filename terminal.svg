<svg width="820" height="300" viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1e"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', monospace; font-size: 15px; }
      .prompt { fill: #34d399; }
      .cmd { fill: #d1d5db; }
      .ok { fill: #22d3ee; font-weight: bold; }
    </style>
  </defs>

  <rect width="820" height="300" rx="14" fill="url(#termBg)" stroke="#1e2a4a" stroke-width="1.5"/>

  <!-- title bar -->
  <rect width="820" height="36" rx="14" fill="#111827"/>
  <rect y="20" width="820" height="16" fill="#111827"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" class="mono" fill="#6b7280" font-size="12">hiren@ml-pipeline: ~</text>

  <g class="mono">
    <text x="20" y="70" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">Loading skills.yml</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.02;0.1" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="20" y="100" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">Connecting to data source</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.14;0.22" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="20" y="130" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">Cleaning data</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.26;0.34" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="20" y="160" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">Training machine learning model</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.38;0.46" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="20" y="190" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">Evaluating model performance</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.52;0.6" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="20" y="220" opacity="0"><tspan class="prompt">$ </tspan><tspan class="ok">Model Accuracy: 96.7%</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.66;0.74" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="20" y="250" opacity="0">
      <tspan class="prompt">$ </tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.78;0.86" dur="10s" repeatCount="indefinite" fill="freeze"/>
    </text>
    <rect x="34" y="238" width="10" height="16" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;1;1;0" keyTimes="0;0.78;0.79;0.85;0.855;0.92;0.925;0.98;1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- loading progress bar under "Training model" line, cycles -->
  <rect x="20" y="170" width="0" height="4" rx="2" fill="#818cf8">
    <animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.38;0.46;0.5;1" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
