<svg width="1200" height="160" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="160" fill="url(#footBg)"/>

  <!-- animated particle line -->
  <rect x="0" y="30" width="1200" height="2" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cy="30" r="4" fill="#22d3ee">
    <animate attributeName="cx" values="0;1200;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="30" r="3" fill="#818cf8">
    <animate attributeName="cx" values="1200;0;1200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="85" text-anchor="middle" class="sans" font-size="22" fill="#e2e8f0" font-weight="600" opacity="0">
    Thanks for visiting my profile!
    <animate attributeName="opacity" values="0;1;1;0.6;1" keyTimes="0;0.2;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="120" text-anchor="middle" class="sans" font-size="17" fill="#34d399">
    Let's build something intelligent together. 🚀
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- small floating dots -->
  <circle cx="120" cy="130" r="2.5" fill="#22d3ee"><animate attributeName="cy" values="130;115;130" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="130" r="2.5" fill="#818cf8"><animate attributeName="cy" values="130;115;130" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="140" r="2" fill="#34d399"><animate attributeName="cy" values="140;125;140" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="140" r="2" fill="#34d399"><animate attributeName="cy" values="140;125;140" dur="3.2s" repeatCount="indefinite"/></circle>
</svg>
