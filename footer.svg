<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="140" fill="#232019"/>

  <line x1="60" y1="30" x2="1140" y2="30" stroke="#4A453D" stroke-width="1" stroke-dasharray="1080">
    <animate attributeName="stroke-dashoffset" from="1080" to="0" dur="1.2s" begin="0.1s" fill="freeze"/>
  </line>

  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#8C8577">
    <text x="60" y="65" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>BUILD</text>
    <text x="150" y="65" fill="#4A453D">&#8594;</text>
    <text x="180" y="65" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>LEARN</text>
    <text x="270" y="65" fill="#4A453D">&#8594;</text>
    <text x="300" y="65" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>ANALYZE</text>
    <text x="410" y="65" fill="#4A453D">&#8594;</text>
    <text x="440" y="65" fill="#C1603C" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>INNOVATE</text>
  </g>

  <text x="60" y="105" font-size="17" font-weight="600" fill="#FAF6EF" opacity="0">
    <animate attributeName="opacity" to="1" dur="0.6s" begin="1.7s" fill="freeze"/>
    Let's build something meaningful.
  </text>

  <text x="1140" y="120" text-anchor="end" font-size="10.5" fill="#4A453D" font-family="'Courier New', monospace">&#169; HIREN KANZARIYA</text>
</svg>
