<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="220" fill="#FAF6EF"/>

  <text x="60" y="55" font-size="12" letter-spacing="3" fill="#8C8577" font-family="'Courier New', monospace">08 &#8212; CONTACT</text>
  <text x="60" y="90" font-size="30" font-weight="700" fill="#232019">Let's Connect</text>
  <line x1="60" y1="106" x2="130" y2="106" stroke="#C1603C" stroke-width="3"/>

  <g font-family="'Courier New', monospace" font-size="13" fill="#232019">
    <g transform="translate(60,140)" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
      <rect width="190" height="42" fill="none" stroke="#232019" stroke-width="1.2"/>
      <text x="16" y="26">GITHUB</text>
    </g>
    <g transform="translate(270,140)" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.35s" fill="freeze"/>
      <rect width="190" height="42" fill="none" stroke="#232019" stroke-width="1.2"/>
      <text x="16" y="26">LINKEDIN</text>
    </g>
    <g transform="translate(480,140)" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
      <rect width="190" height="42" fill="#C1603C"/>
      <text x="16" y="26" fill="#FAF6EF">EMAIL</text>
    </g>
    <g transform="translate(690,140)" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.65s" fill="freeze"/>
      <rect width="190" height="42" fill="none" stroke="#232019" stroke-width="1.2"/>
      <text x="16" y="26">PORTFOLIO</text>
    </g>
    <g transform="translate(900,140)" opacity="0"><animate attributeName="opacity" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
      <rect width="190" height="42" fill="none" stroke="#232019" stroke-width="1.2"/>
      <text x="16" y="26">YOUTUBE</text>
    </g>
  </g>

  <circle cx="1150" cy="60" r="4" fill="#6E7452">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
