<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="620" fill="#FAF6EF"/>

  <text x="60" y="55" font-size="12" letter-spacing="3" fill="#8C8577" font-family="'Courier New', monospace">03 &#8212; PROJECTS</text>
  <text x="60" y="90" font-size="30" font-weight="700" fill="#232019">What I've Built</text>
  <line x1="60" y1="106" x2="130" y2="106" stroke="#C1603C" stroke-width="3"/>

  <!-- Card template macro (hand-rolled x4) -->
  <!-- CARD 1 -->
  <g transform="translate(60,140)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="60,180" to="60,140" dur="0.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
    <rect width="530" height="200" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="1"/>
    <rect width="4" height="200" fill="#C1603C"/>
    <text x="26" y="36" font-size="17" font-weight="700" fill="#232019">Sales Data Analysis Dashboard</text>
    <text x="26" y="58" font-size="12.5" fill="#4A453D">End-to-end retail sales analysis with an interactive</text>
    <text x="26" y="75" font-size="12.5" fill="#4A453D">Power BI dashboard highlighting revenue trends.</text>

    <!-- tags -->
    <g font-size="10.5" font-family="'Courier New', monospace" fill="#232019">
      <rect x="26" y="88" width="58" height="20" fill="#F1E9DA"/><text x="55" y="102" text-anchor="middle">PYTHON</text>
      <rect x="90" y="88" width="60" height="20" fill="#F1E9DA"/><text x="120" y="102" text-anchor="middle">PANDAS</text>
      <rect x="156" y="88" width="66" height="20" fill="#F1E9DA"/><text x="189" y="102" text-anchor="middle">POWER BI</text>
    </g>

    <!-- storytelling strip -->
    <g transform="translate(26,124)" font-size="9.5" font-family="'Courier New', monospace" fill="#8C8577" letter-spacing="0.5">
      <text x="0" y="0">PROBLEM</text><text x="80" y="0">&#8594;</text>
      <text x="100" y="0">APPROACH</text><text x="185" y="0">&#8594;</text>
      <text x="205" y="0">TECH</text><text x="245" y="0">&#8594;</text>
      <text x="265" y="0" fill="#C1603C" font-weight="700">RESULT</text>
      <line x1="0" y1="10" x2="330" y2="10" stroke="#E4D9C5" stroke-width="4" stroke-dasharray="330">
        <animate attributeName="stroke-dashoffset" from="330" to="0" dur="1s" begin="0.9s" fill="freeze"/>
      </line>
    </g>
    <text x="26" y="168" font-size="11.5" fill="#4A453D">Messy regional sales data &#8594; cleaned &amp; explored &#8594; visualized</text>
    <text x="26" y="184" font-size="11.5" fill="#4A453D">as a clear, decision-ready dashboard for stakeholders.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(610,140)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="610,180" to="610,140" dur="0.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
    <rect width="530" height="200" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="1"/>
    <rect width="4" height="200" fill="#6E7452"/>
    <text x="26" y="36" font-size="17" font-weight="700" fill="#232019">Customer Churn Prediction</text>
    <text x="26" y="58" font-size="12.5" fill="#4A453D">Classification model predicting customer churn with</text>
    <text x="26" y="75" font-size="12.5" fill="#4A453D">feature engineering and precision/recall/ROC-AUC eval.</text>

    <g font-size="10.5" font-family="'Courier New', monospace" fill="#232019">
      <rect x="26" y="88" width="58" height="20" fill="#F1E9DA"/><text x="55" y="102" text-anchor="middle">PYTHON</text>
      <rect x="90" y="88" width="92" height="20" fill="#F1E9DA"/><text x="136" y="102" text-anchor="middle">SCIKIT-LEARN</text>
      <rect x="188" y="88" width="60" height="20" fill="#F1E9DA"/><text x="218" y="102" text-anchor="middle">NUMPY</text>
    </g>

    <g transform="translate(26,124)" font-size="9.5" font-family="'Courier New', monospace" fill="#8C8577" letter-spacing="0.5">
      <text x="0" y="0">PROBLEM</text><text x="80" y="0">&#8594;</text>
      <text x="100" y="0">APPROACH</text><text x="185" y="0">&#8594;</text>
      <text x="205" y="0">TECH</text><text x="245" y="0">&#8594;</text>
      <text x="265" y="0" fill="#6E7452" font-weight="700">RESULT</text>
      <line x1="0" y1="10" x2="330" y2="10" stroke="#E4D9C5" stroke-width="4" stroke-dasharray="330">
        <animate attributeName="stroke-dashoffset" from="330" to="0" dur="1s" begin="1.1s" fill="freeze"/>
      </line>
    </g>
    <text x="26" y="168" font-size="11.5" fill="#4A453D">At-risk customers &#8594; modeled &amp; compared &#8594; ranked by</text>
    <text x="26" y="184" font-size="11.5" fill="#4A453D">churn probability to guide retention efforts.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(60,360)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="60,400" to="60,360" dur="0.5s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
    <rect width="530" height="200" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="1"/>
    <rect width="4" height="200" fill="#D6A94A"/>
    <text x="26" y="36" font-size="17" font-weight="700" fill="#232019">SQL Data Exploration Toolkit</text>
    <text x="26" y="58" font-size="12.5" fill="#4A453D">SQL queries &amp; stored procedures for exploring, cleaning,</text>
    <text x="26" y="75" font-size="12.5" fill="#4A453D">and aggregating large relational datasets.</text>

    <g font-size="10.5" font-family="'Courier New', monospace" fill="#232019">
      <rect x="26" y="88" width="44" height="20" fill="#F1E9DA"/><text x="48" y="102" text-anchor="middle">SQL</text>
      <rect x="76" y="88" width="90" height="20" fill="#F1E9DA"/><text x="121" y="102" text-anchor="middle">POSTGRESQL</text>
    </g>

    <g transform="translate(26,124)" font-size="9.5" font-family="'Courier New', monospace" fill="#8C8577" letter-spacing="0.5">
      <text x="0" y="0">PROBLEM</text><text x="80" y="0">&#8594;</text>
      <text x="100" y="0">APPROACH</text><text x="185" y="0">&#8594;</text>
      <text x="205" y="0">TECH</text><text x="245" y="0">&#8594;</text>
      <text x="265" y="0" fill="#B48A2E" font-weight="700">RESULT</text>
      <line x1="0" y1="10" x2="330" y2="10" stroke="#E4D9C5" stroke-width="4" stroke-dasharray="330">
        <animate attributeName="stroke-dashoffset" from="330" to="0" dur="1s" begin="1.3s" fill="freeze"/>
      </line>
    </g>
    <text x="26" y="168" font-size="11.5" fill="#4A453D">Real business questions &#8594; reusable queries &#8594; a toolkit</text>
    <text x="26" y="184" font-size="11.5" fill="#4A453D">for fast, repeatable relational data exploration.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(610,360)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="610,400" to="610,360" dur="0.5s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <rect width="530" height="200" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="1"/>
    <rect width="4" height="200" fill="#232019"/>
    <text x="26" y="36" font-size="17" font-weight="700" fill="#232019">Exploratory Data Analysis Toolkit</text>
    <text x="26" y="58" font-size="12.5" fill="#4A453D">Reusable Python toolkit for fast EDA &#8212; automated</text>
    <text x="26" y="75" font-size="12.5" fill="#4A453D">summary stats, missing-value reports, visualization.</text>

    <g font-size="10.5" font-family="'Courier New', monospace" fill="#232019">
      <rect x="26" y="88" width="58" height="20" fill="#F1E9DA"/><text x="55" y="102" text-anchor="middle">PYTHON</text>
      <rect x="90" y="88" width="86" height="20" fill="#F1E9DA"/><text x="133" y="102" text-anchor="middle">MATPLOTLIB</text>
      <rect x="182" y="88" width="70" height="20" fill="#F1E9DA"/><text x="217" y="102" text-anchor="middle">SEABORN</text>
    </g>

    <g transform="translate(26,124)" font-size="9.5" font-family="'Courier New', monospace" fill="#8C8577" letter-spacing="0.5">
      <text x="0" y="0">PROBLEM</text><text x="80" y="0">&#8594;</text>
      <text x="100" y="0">APPROACH</text><text x="185" y="0">&#8594;</text>
      <text x="205" y="0">TECH</text><text x="245" y="0">&#8594;</text>
      <text x="265" y="0" fill="#232019" font-weight="700">RESULT</text>
      <line x1="0" y1="10" x2="330" y2="10" stroke="#E4D9C5" stroke-width="4" stroke-dasharray="330">
        <animate attributeName="stroke-dashoffset" from="330" to="0" dur="1s" begin="1.5s" fill="freeze"/>
      </line>
    </g>
    <text x="26" y="168" font-size="11.5" fill="#4A453D">Slow, repetitive first-look analysis &#8594; automated into</text>
    <text x="26" y="184" font-size="11.5" fill="#4A453D">a reusable, drop-in EDA toolkit.</text>
  </g>

  <line x1="60" y1="590" x2="1140" y2="590" stroke="#E4D9C5" stroke-width="1"/>
  <text x="60" y="610" font-size="10.5" letter-spacing="1" fill="#8C8577" font-family="'Courier New', monospace">REPOSITORY LINKS IN THE README BELOW</text>
</svg>
